<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electrical Services — Certificate Details</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#edf3fa;font-family:Arial,sans-serif}
main{width:min(100%,1200px);margin:0 auto;padding:12px}
.certificate{position:relative;width:100%;line-height:0;background:#fff}
.certificate img{display:block;width:100%;height:auto}
.qr-cover{
 position:absolute; left:83.35%; top:42.45%; width:11.95%; aspect-ratio:1;
 background:#fff; display:flex;align-items:center;justify-content:center;
 padding:1.05%; border:1px solid #082d70;border-radius:5%;
}
#qrcode{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#qrcode img,#qrcode canvas{display:block;width:100%!important;height:100%!important;image-rendering:pixelated}
.note{line-height:1.5;text-align:center;color:#243a5b;font-size:14px;margin:14px 4px}
@media print{body{background:#fff}main{padding:0}.note{display:none}}
</style>
</head>
<body>
<main>
  <div class="certificate">
    <img src="certificate.png" alt="Certificate image">
    <div class="qr-cover" aria-label="Working QR code">
      <div id="qrcode"></div>
    </div>
  </div>
  <p class="note">The QR code above is generated for this published webpage. Upload both <b>index.html</b> and <b>certificate.png</b> to the same GitHub Pages location. Open the published page with internet access, then scan the QR code using another phone.</p>
</main>
<script>
(function(){
  const url = window.location.href.split('#')[0];
  const holder = document.getElementById('qrcode');
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  script.onload = function(){
    holder.innerHTML = '';
    new QRCode(holder, {text:url, width:240, height:240, correctLevel:QRCode.CorrectLevel.H});
  };
  script.onerror = function(){
    holder.innerHTML = '<span style="font-size:8px;line-height:1.1;text-align:center;color:#111">QR needs<br>internet</span>';
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
